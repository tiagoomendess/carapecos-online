<!doctype html>
<html lang="pt-PT">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="robots" content="noindex" />
		<title>Sem ligação · Carapeços Online</title>
		<link rel="icon" type="image/png" href="/favicon.png" />
		<style>
			:root {
				color-scheme: light dark;
				--bg: light-dark(#f5f5f7, #0c1628);
				--text: light-dark(#111, #eef3fb);
				--text-2: light-dark(#5c5c63, #93a4bf);
			}
			body {
				margin: 0;
				min-height: 100dvh;
				display: grid;
				place-items: center;
				padding: 1rem;
				box-sizing: border-box;
				background: var(--bg);
				color: var(--text);
				font: 100%/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
				text-align: center;
			}
			h1 {
				margin: 1rem 0 0.5rem;
				font-size: 1.5rem;
				letter-spacing: -0.02em;
			}
			p {
				margin: 0 auto;
				max-width: 22rem;
				color: var(--text-2);
			}
			button {
				margin-top: 1.5rem;
				padding: 0.75rem 1.25rem;
				border: 0;
				border-radius: 999px;
				background: var(--text);
				color: var(--bg);
				font: inherit;
				font-weight: 600;
			}
		</style>
	</head>
	<body>
		<main>
			<img src="/logo-128.webp" alt="" width="64" height="64" />
			<h1>Sem ligação à internet</h1>
			<p>
				Esta página ainda não foi guardada para leitura offline. As notícias que já abriu
				continuam disponíveis.
			</p>
			<button type="button" onclick="location.reload()">Tentar outra vez</button>
		</main>
	</body>
</html>
